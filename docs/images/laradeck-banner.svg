<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="50%" stop-color="#0F131C" />
      <stop offset="100%" stop-color="#07080D" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="banner-glow" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#FF2D20" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="85%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Laravel Brand Gradient -->
    <linearGradient id="laravel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF574A" />
      <stop offset="50%" stop-color="#FF2D20" />
      <stop offset="100%" stop-color="#CC160B" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="deck-top" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2D3342" />
      <stop offset="100%" stop-color="#151922" />
    </linearGradient>

    <linearGradient id="deck-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1218" />
      <stop offset="100%" stop-color="#1A1F2B" />
    </linearGradient>

    <!-- Filters -->
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Banner Background Frame -->
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#banner-bg)" stroke="#1E2430" stroke-width="2" />
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#banner-glow)" />
  <rect x="0" y="0" width="1200" height="320" rx="24" fill="url(#cyan-glow)" />

  <!-- Background Telemetry Grid lines -->
  <g opacity="0.08" stroke="#64748B" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- LEFT EMBLEM (scaled from logo) -->
  <g transform="translate(48, 20) scale(0.54)">
    <!-- Base Squircle -->
    <rect x="16" y="16" width="480" height="480" rx="108" fill="#0E121A" stroke="#2B3245" stroke-width="3" />
    
    <!-- Radar ellipses -->
    <ellipse cx="256" cy="265" rx="180" ry="100" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25" />
    <ellipse cx="256" cy="265" rx="120" ry="65" fill="none" stroke="#64748B" stroke-width="1.5" opacity="0.25" />

    <!-- Isometric control deck -->
    <g filter="url(#drop-shadow)">
      <path d="M 120 310 L 256 385 L 256 405 L 120 330 Z" fill="#0A0D14" />
      <path d="M 256 385 L 392 310 L 392 330 L 256 405 Z" fill="#0F131D" />
      <path d="M 120 310 L 256 235 L 392 310 L 256 385 Z" fill="url(#deck-edge)" stroke="#222938" stroke-width="1.5" />
    </g>

    <g transform="translate(0, -32)" filter="url(#drop-shadow)">
      <path d="M 136 295 L 256 362 L 256 376 L 136 309 Z" fill="#111622" />
      <path d="M 256 362 L 376 295 L 376 309 L 256 376 Z" fill="#181E2E" />
      <path d="M 136 295 L 256 228 L 376 295 L 256 362 Z" fill="url(#deck-top)" stroke="#333C4E" stroke-width="1.5" />
      <path d="M 170 290 L 235 326 L 256 314" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.8" />
      <circle cx="170" cy="290" r="3" fill="#38BDF8" filter="url(#soft-glow)" />
      <path d="M 342 290 L 277 326 L 256 314" fill="none" stroke="#FF2D20" stroke-width="2" opacity="0.7" />
      <circle cx="342" cy="290" r="3" fill="#FF4B3E" filter="url(#soft-glow)" />
    </g>

    <g transform="translate(0, -68)" filter="url(#core-glow)">
      <path d="M 152 268 L 256 326 L 256 344 L 152 286 Z" fill="#991107" />
      <path d="M 256 326 L 360 268 L 360 286 L 256 344 Z" fill="#B91409" />
      <path d="M 256 160 L 360 220 L 316 245 L 256 210 L 204 240 L 256 270 L 220 291 L 152 252 Z" fill="url(#laravel-grad)" stroke="#FFA59E" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 256 205 L 284 221 L 256 237 L 228 221 Z" fill="#FFFFFF" opacity="0.95" filter="url(#soft-glow)" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(360, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#1E1419" stroke="#FF2D20" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="4" fill="#FF2D20" filter="url(#soft-glow)" />
      <text x="26" y="17" fill="#FFA59E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">LARAVEL WORKBENCH</text>
    </g>

    <!-- Main Title "LaraDeck" -->
    <g transform="translate(0, 156)">
      <text x="0" y="0" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="76" font-weight="900" letter-spacing="-1.5">
        Lara<tspan fill="url(#laravel-grad)">Deck</tspan>
      </text>
      <!-- Cyber telemetry dot -->
      <circle cx="340" cy="-14" r="7" fill="#FF2D20" filter="url(#core-glow)" />
    </g>

    <!-- Subtitle / Tagline -->
    <text x="2" y="196" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.4">
      Modern Mission Control &amp; Observability Workstation for Laravel
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 226)">
      <!-- Pill 1: Zero-Package Debugger -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="28" rx="6" fill="#141822" stroke="#2A3346" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#22C55E" />
        <text x="22" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero-Package Agent</text>
      </g>
      <!-- Pill 2: Microsecond Flamegraph -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="168" height="28" rx="6" fill="#141822" stroke="#2A3346" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#38BDF8" />
        <text x="22" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Activity Flamegraphs</text>
      </g>
      <!-- Pill 3: Events & Queues Pro -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="158" height="28" rx="6" fill="#141822" stroke="#2A3346" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#F59E0B" />
        <text x="22" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Queue Supervisor</text>
      </g>
      <!-- Pill 4: Herd Symbiosis -->
      <g transform="translate(530, 0)">
        <rect x="0" y="0" width="144" height="28" rx="6" fill="#1E1419" stroke="#FF2D20" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="12" cy="14" r="3" fill="#FF2D20" />
        <text x="22" y="18" fill="#FFA59E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Herd Symbiosis</text>
      </g>
    </g>
  </g>
</svg>
