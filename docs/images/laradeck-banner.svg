<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#080A0E" />
    </linearGradient>
    <radialGradient id="subtle-red" cx="15%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F73931" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bg-grad)" stroke="#1F2430" stroke-width="2" />
  <rect width="1200" height="320" rx="20" fill="url(#subtle-red)" />

  <!-- Background Grid Lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="720" y1="0" x2="720" y2="320" />
    <line x1="1040" y1="0" x2="1040" y2="320" />
  </g>

  <!-- Left Mark: App Icon Badge with White Mark (Matching User Design) -->
  <g transform="translate(64, 40) scale(0.46875)">
    <rect width="512" height="512" rx="108" fill="#1C1C1C" stroke="#2D3340" stroke-width="3" />
    <path d="M 80 87 L 179 50 L 179 269 L 285 228 L 427 280 L 219 375 L 80 311 Z" fill="#FFFFFF" />
    <path d="M 80 340 L 219 408 L 432 351 L 219 461 L 80 389 Z" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(350, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 72)">
      <rect width="210" height="26" rx="13" fill="#1E1419" stroke="#F73931" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="4" fill="#F73931" />
      <text x="26" y="17" fill="#FFA59E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">LARAVEL WORKBENCH</text>
    </g>

    <!-- Title "LaraDeck" -->
    <g transform="translate(0, 156)">
      <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-1.5">
        Lara<tspan fill="#F73931">Deck</tspan>
      </text>
      <circle cx="342" cy="-14" r="7" fill="#F73931" />
    </g>

    <!-- Subtitle -->
    <text x="2" y="196" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.4">
      Modern Mission Control &amp; Observability Workstation for Laravel
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 226)">
      <g transform="translate(0, 0)">
        <rect width="168" height="28" rx="6" fill="#141822" stroke="#2A3346" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#22C55E" />
        <text x="22" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero-Package Agent</text>
      </g>
      <g transform="translate(180, 0)">
        <rect width="168" height="28" rx="6" fill="#141822" stroke="#2A3346" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#38BDF8" />
        <text x="22" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Activity Flamegraphs</text>
      </g>
      <g transform="translate(360, 0)">
        <rect width="158" height="28" rx="6" fill="#141822" stroke="#2A3346" stroke-width="1" />
        <circle cx="12" cy="14" r="3" fill="#F59E0B" />
        <text x="22" y="18" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Queue Supervisor</text>
      </g>
      <g transform="translate(530, 0)">
        <rect width="144" height="28" rx="6" fill="#1E1419" stroke="#F73931" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="12" cy="14" r="3" fill="#F73931" />
        <text x="22" y="18" fill="#FFA59E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Herd Symbiosis</text>
      </g>
    </g>
  </g>
</svg>