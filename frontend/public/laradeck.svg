<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="50%" stop-color="#0c1019"/>
      <stop offset="100%" stop-color="#07090f"/>
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Monogram Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Pulse Wave Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Hull -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="url(#rimGrad)" stroke-width="1.5" />

  <!-- Ambient Deck Glow -->
  <circle cx="64" cy="64" r="38" fill="#6366f1" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="78" cy="74" r="28" fill="#06b6d4" opacity="0.10" filter="url(#softGlow)" />

  <!-- Isometric Console Deck Grid Lines -->
  <path d="M26 84 L64 102 L102 84" fill="none" stroke="#26344d" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M34 76 L64 90 L94 76" fill="none" stroke="#26344d" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4" />

  <!-- Main 'L' Command Monogram -->
  <!-- Vertical Beam of L -->
  <path d="M 40 32
           C 40 28.5, 42.5 26, 46 26
           L 54 26
           C 57.5 26, 60 28.5, 60 32
           L 60 76
           L 88 76
           C 91.5 76, 94 78.5, 94 82
           L 94 88
           C 94 91.5, 91.5 94, 88 94
           L 46 94
           C 42.5 94, 40 91.5, 40 88
           Z"
        fill="url(#neonGrad)"
        filter="url(#neonGlow)" />

  <!-- High-Tech Telemetry Pulse across the Deck -->
  <path d="M 32 85 L 48 85 L 53 77 L 58 91 L 63 85 L 75 85 L 79 80 L 83 89 L 87 85 L 98 85"
        fill="none"
        stroke="url(#pulseGrad)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9" />

  <!-- Mission Control Status Dot / Spark -->
  <circle cx="94" cy="34" r="3.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="94" cy="34" r="1.5" fill="#ffffff" />
</svg>
