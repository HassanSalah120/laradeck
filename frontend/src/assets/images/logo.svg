<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1318" />
      <stop offset="40%" stop-color="#0F1117" />
      <stop offset="100%" stop-color="#07090E" />
    </radialGradient>

    <!-- Laravel Brand Gradient -->
    <linearGradient id="laravel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B3E" />
      <stop offset="50%" stop-color="#FF2D20" />
      <stop offset="100%" stop-color="#D1180C" />
    </linearGradient>

    <linearGradient id="laravel-glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2D20" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF2D20" stop-opacity="0" />
    </linearGradient>

    <!-- Deck Plate Gradient -->
    <linearGradient id="deck-top" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2D3342" />
      <stop offset="100%" stop-color="#151922" />
    </linearGradient>

    <linearGradient id="deck-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F1218" />
      <stop offset="100%" stop-color="#1A1F2B" />
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-glow)" stroke="#262B38" stroke-width="2.5" />

  <!-- Ambient Flare behind deck -->
  <ellipse cx="256" cy="270" rx="140" ry="80" fill="url(#laravel-glow-grad)" filter="url(#core-glow)" opacity="0.45" />

  <!-- Background Radar / HUD Circles -->
  <g opacity="0.15">
    <ellipse cx="256" cy="265" rx="190" ry="105" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 8" />
    <ellipse cx="256" cy="265" rx="145" ry="80" fill="none" stroke="#64748B" stroke-width="1.5" />
    <ellipse cx="256" cy="265" rx="90" ry="50" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="3 5" />
    <line x1="256" y1="130" x2="256" y2="400" stroke="#64748B" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="90" y1="265" x2="422" y2="265" stroke="#64748B" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- ISOMETRIC CONTROL DECK ASSEMBLY -->
  <!-- Level 1: Bottom Substructure Foundation -->
  <g filter="url(#drop-shadow)">
    <!-- Base extrusion side left -->
    <path d="M 120 310 L 256 385 L 256 405 L 120 330 Z" fill="#0A0D14" />
    <!-- Base extrusion side right -->
    <path d="M 256 385 L 392 310 L 392 330 L 256 405 Z" fill="#0F131D" />
    <!-- Base top surface -->
    <path d="M 120 310 L 256 235 L 392 310 L 256 385 Z" fill="url(#deck-edge)" stroke="#222938" stroke-width="1.5" />
  </g>

  <!-- Level 2: Flight Control Mid-Tier Deck with Neon Circuit Traces -->
  <g transform="translate(0, -32)" filter="url(#drop-shadow)">
    <!-- Mid deck side left -->
    <path d="M 136 295 L 256 362 L 256 376 L 136 309 Z" fill="#111622" />
    <!-- Mid deck side right -->
    <path d="M 256 362 L 376 295 L 376 309 L 256 376 Z" fill="#181E2E" />
    <!-- Mid deck top face -->
    <path d="M 136 295 L 256 228 L 376 295 L 256 362 Z" fill="url(#deck-top)" stroke="#333C4E" stroke-width="1.5" />

    <!-- Circuit Bus Lines on Mid Deck -->
    <path d="M 170 290 L 235 326 L 256 314" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.8" />
    <circle cx="170" cy="290" r="3" fill="#38BDF8" filter="url(#soft-glow)" />
    <path d="M 342 290 L 277 326 L 256 314" fill="none" stroke="#FF2D20" stroke-width="2" opacity="0.7" />
    <circle cx="342" cy="290" r="3" fill="#FF4B3E" filter="url(#soft-glow)" />
  </g>

  <!-- Level 3: The "L"-Deck Command Core (Supersonic Wing Prism) -->
  <g transform="translate(0, -68)" filter="url(#core-glow)">
    <!-- Left Wing Extrusion (Under-edge bevel) -->
    <path d="M 152 268 L 256 326 L 256 344 L 152 286 Z" fill="#991107" />
    <!-- Right Wing Extrusion -->
    <path d="M 256 326 L 360 268 L 360 286 L 256 344 Z" fill="#B91409" />

    <!-- Isometric Monogrammed 'L' Wing Surface -->
    <path d="M 256 160 
             L 360 220 
             L 316 245 
             L 256 210 
             L 204 240 
             L 256 270 
             L 220 291 
             L 152 252 Z" 
          fill="url(#laravel-grad)" 
          stroke="#FFA59E" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Center Laser Core Prism / Reactor Diamond -->
    <path d="M 256 205 L 284 221 L 256 237 L 228 221 Z" fill="#FFFFFF" opacity="0.95" filter="url(#soft-glow)" />
    <path d="M 256 237 L 284 221 L 284 229 L 256 245 Z" fill="#CBD5E1" opacity="0.8" />
    <path d="M 228 221 L 256 237 L 256 245 L 228 229 Z" fill="#94A3B8" opacity="0.8" />
  </g>

  <!-- Floating Telemetry HUD Badges & Indicators -->
  <!-- Upper Left Status Node (Laravel Live Beacon) -->
  <g transform="translate(92, 112)">
    <circle cx="0" cy="0" r="14" fill="#151924" stroke="#2B3245" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#FF2D20" filter="url(#soft-glow)" />
    <line x1="12" y1="8" x2="36" y2="24" stroke="#FF2D20" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />
  </g>

  <!-- Upper Right Status Node (Observability Engine) -->
  <g transform="translate(420, 112)">
    <circle cx="0" cy="0" r="14" fill="#151924" stroke="#2B3245" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#38BDF8" filter="url(#soft-glow)" />
    <line x1="-12" y1="8" x2="-36" y2="24" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />
  </g>

  <!-- Center Top Mission Target Pointer -->
  <polygon points="256,92 263,106 249,106" fill="#FF2D20" filter="url(#soft-glow)" />
  <line x1="256" y1="112" x2="256" y2="132" stroke="#FF2D20" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom HUD Status Bar -->
  <g transform="translate(146, 436)">
    <!-- Rail track -->
    <rect x="0" y="0" width="220" height="18" rx="9" fill="#10141D" stroke="#232B3B" stroke-width="1.5" />
    <!-- Telemetry LEDs -->
    <circle cx="24" cy="9" r="4" fill="#22C55E" filter="url(#soft-glow)" />
    <circle cx="44" cy="9" r="4" fill="#38BDF8" />
    <circle cx="64" cy="9" r="4" fill="#F59E0B" />
    <circle cx="84" cy="9" r="4" fill="#FF2D20" />
    <!-- Data bars -->
    <rect x="108" y="7" width="28" height="4" rx="2" fill="#38BDF8" opacity="0.8" />
    <rect x="142" y="7" width="42" height="4" rx="2" fill="#FF2D20" opacity="0.9" />
    <rect x="190" y="7" width="16" height="4" rx="2" fill="#64748B" opacity="0.6" />
  </g>
</svg>
